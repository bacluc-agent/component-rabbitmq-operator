applications:
  - cilium
parameters:
  rabbitmq_operator:
    namespace: custom-rabbitmq
    namespaceLabels:
      custom.net: 'true'
    rabbitmq:
      enabled: true
      name: custom-rabbitmq
      namespace: custom-rabbitmq-cluster
      replicas: 3
      ciliumNetworkPolicy:
        enabled: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq-test
              topologyKey: kubernetes.io/hostname
      namespaceLabels:
        test.net: true
      tls:
        enabled: true
      rbac:
        enabled: true
        group: group
        groups:
          - group
          - my-other-group
      plugins:
        - rabbitmq_shovel
        - rabbitmq_shovel_management
      service:
        annotations:
          lbipam.cilium.io/ips: 192.0.2.50
      additionalConfig: |
        channel_max = 100
        vm_memory_high_watermark.absolute = 2Gi
      custom_lb_service:
        enabled: true
        loadBalancerClass: io.cilium/l2-announcer
    prober:
      enabled: true
      alerts:
        enabled: true
