apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: custom-rabbitmq
spec:
  dnsNames:
    - webhook-service.custom-rabbitmq.svc
    - webhook-service.custom-rabbitmq.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
