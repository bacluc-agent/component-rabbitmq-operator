parameters:
  kapitan:
    dependencies:
      - type: helm
        source: ${rabbitmq_operator:charts:rabbitmq-crd:source}
        chart_name: rabbitmq-crd
        version: ${rabbitmq_operator:charts:rabbitmq-crd:version}
        output_path: ${_base_directory}/helmcharts/rabbitmq-crd-${rabbitmq_operator:charts:rabbitmq-crd:version}
      - type: helm
        source: ${rabbitmq_operator:charts:rabbitmq-operator:source}
        chart_name: rabbitmq-operator
        version: ${rabbitmq_operator:charts:rabbitmq-operator:version}
        output_path: ${_base_directory}/helmcharts/rabbitmq-operator-${rabbitmq_operator:charts:rabbitmq-operator:version}
      - type: helm
        source: ${rabbitmq_operator:charts:rabbitmq-instance:source}
        chart_name: rabbitmq-instance
        version: ${rabbitmq_operator:charts:rabbitmq-instance:version}
        output_path: ${_base_directory}/helmcharts/rabbitmq-instance-${rabbitmq_operator:charts:rabbitmq-instance:version}
      - type: helm
        source: ${rabbitmq_operator:charts:test-helm-chart:source}
        chart_name: test-helm-chart
        version: ${rabbitmq_operator:charts:test-helm-chart:version}
        output_path: ${_base_directory}/helmcharts/test-helm-chart-${rabbitmq_operator:charts:test-helm-chart:version}
    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: ${_instance}/rabbitmq-operator
      - input_paths:
          - ${_base_directory}/helmcharts/rabbitmq-crd-${rabbitmq_operator:charts:rabbitmq-crd:version}
        input_type: helm
        output_path: ${_instance}/rabbitmq-operator/crd
        helm_values: ${rabbitmq_operator:crd:helmValues}
        helm_params:
          name: ${_instance}
          namespace: ${rabbitmq_operator:namespace}
      - input_paths:
          - ${_base_directory}/helmcharts/rabbitmq-operator-${rabbitmq_operator:charts:rabbitmq-operator:version}
        input_type: helm
        output_path: ${_instance}/rabbitmq-operator/operator
        helm_values: ${rabbitmq_operator:operator:helmValues}
        helm_params:
          name: ${_instance}
          namespace: ${rabbitmq_operator:namespace}
      - input_paths:
          - ${_base_directory}/helmcharts/rabbitmq-instance-${rabbitmq_operator:charts:rabbitmq-instance:version}
        input_type: helm
        output_path: ${_instance}/rabbitmq-operator/instance
        helm_values: ${rabbitmq_operator:instance:helmValues}
        helm_params:
          name: ${_instance}
          namespace: ${rabbitmq_operator:namespace}
      - input_paths:
          - ${_base_directory}/helmcharts/test-helm-chart-${rabbitmq_operator:charts:test-helm-chart:version}
        input_type: helm
        output_path: ${_instance}/rabbitmq-operator/test
        helm_values: ${rabbitmq_operator:test:helmValues}
        helm_params:
          name: ${_instance}
          namespace: ${rabbitmq_operator:namespace}
