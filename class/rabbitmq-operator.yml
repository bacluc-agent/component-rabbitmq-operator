parameters:
  kapitan:
    dependencies:
      - type: https
        source: ${rabbitmq_operator:manifest_url}/v${rabbitmq_operator:manifest_version}/cluster-operator.yml
        output_path: dependencies/rabbitmq-cluster-operator/manifests/operator/${rabbitmq_operator:manifest_version}/cluster-operator.yml
    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: rabbitmq-operator/
      - input_paths:
          - ${_base_directory}/component/prober.jsonnet
        input_type: jsonnet
        output_path: rabbitmq-operator/prober/
      - input_paths:
          - ${_base_directory}/component/rabbitmq.jsonnet
        input_type: jsonnet
        output_path: rabbitmq-operator/rabbitmq/
