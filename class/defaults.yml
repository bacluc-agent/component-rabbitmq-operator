parameters:
  rabbitmq_operator:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true
    namespace: ${_instance}
    createNamespace: true
    namespaceLabels: {}
    namespaceAnnotations: {}
    charts:
      rabbitmq-crd:
        source: oci://ghcr.io/bacluc-agent/rabbitmq-crd-chart/rabbitmq-crd
        version: 0.0.1
      rabbitmq-operator:
        source: oci://ghcr.io/bacluc-agent/rabbitmq-operator-chart/rabbitmq-operator
        version: 0.0.1
      rabbitmq-instance:
        source: oci://ghcr.io/bacluc-agent/rabbitmq-instance-chart/rabbitmq-instance
        version: 0.0.1
    crd:
      helmValues: {}
    operator:
      helmValues:
        useCertManager: true
    instance:
      helmValues:
        namespace: ${rabbitmq_operator:rabbitmq:namespace}
        rabbitmq: ${rabbitmq_operator:rabbitmq}
        prober: ${rabbitmq_operator:prober}
    test:
      helmValues:
        foo: bar
    rabbitmq:
      enabled: true
      name: rabbitmq
      namespace: rabbitmq
      replicas: 1
      ciliumNetworkPolicy:
        enabled: false
    prober:
      enabled: false
      probeInterval: '10'
